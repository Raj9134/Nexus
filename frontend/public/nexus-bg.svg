<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="72%" cy="45%" r="80%">
      <stop offset="0" stop-color="#2A1580"/>
      <stop offset="0.45" stop-color="#140C46"/>
      <stop offset="1" stop-color="#070420"/>
    </radialGradient>
    <linearGradient id="thread" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1380" y2="0">
      <stop offset="0" stop-color="#6EE7FF" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#4F7BFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FF3D8B" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="threadR" gradientUnits="userSpaceOnUse" x1="1920" y1="0" x2="1380" y2="0">
      <stop offset="0" stop-color="#6EE7FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FF3D8B" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.12" stop-color="#FFE9A8"/>
      <stop offset="0.3" stop-color="#FFB547" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FF3D8B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF3D8B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7A5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7A5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070420" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#070420" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#6EE7FF" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- perspective floor grid -->
  <g stroke="url(#floor)" stroke-width="1" fill="none" opacity="0.7">
    <path d="M0 840H1920M0 900H1920M0 970H1920M0 1050H1920"/>
    <path d="M960 760L-600 1080M960 760L-100 1080M960 760L400 1080M960 760L960 1080M960 760L1520 1080M960 760L2020 1080M960 760L2520 1080"/>
  </g>

  <!-- halo behind core -->
  <circle cx="1380" cy="480" r="620" fill="url(#halo)"/>

  <!-- orbital rings -->
  <g fill="none" stroke="#9FB4FF" stroke-width="1.2" opacity="0.5">
    <ellipse cx="1380" cy="480" rx="330" ry="110" transform="rotate(-22 1380 480)"/>
    <ellipse cx="1380" cy="480" rx="470" ry="170" transform="rotate(14 1380 480)" stroke-dasharray="3 9"/>
    <ellipse cx="1380" cy="480" rx="620" ry="250" transform="rotate(-8 1380 480)" opacity="0.5"/>
  </g>

  <!-- converging threads -->
  <g fill="none" stroke-width="2" filter="url(#glow)">
    <g stroke="url(#thread)">
      <path d="M0 180C400 120 900 420 1380 480"/>
      <path d="M0 420C500 380 900 520 1380 480"/>
      <path d="M0 700C450 760 950 560 1380 480"/>
      <path d="M0 940C500 900 1000 640 1380 480"/>
      <path d="M300 0C600 250 1000 300 1380 480"/>
      <path d="M900 0C1000 200 1250 330 1380 480"/>
      <path d="M600 1080C800 860 1150 660 1380 480"/>
      <path d="M1200 1080C1250 860 1330 680 1380 480"/>
    </g>
    <g stroke="url(#threadR)">
      <path d="M1920 150C1750 250 1550 380 1380 480"/>
      <path d="M1920 850C1750 740 1550 600 1380 480"/>
    </g>
  </g>

  <!-- team nodes -->
  <g filter="url(#glow)">
    <g fill="#6EE7FF">
      <circle cx="660" cy="285" r="7"/><circle cx="698" cy="450" r="9"/>
      <circle cx="698" cy="643" r="7"/><circle cx="735" cy="755" r="6"/>
      <circle cx="810" cy="266" r="6"/><circle cx="979" cy="765" r="8"/>
    </g>
    <g fill="#FFB547">
      <circle cx="1129" cy="259" r="8"/><circle cx="1290" cy="772" r="7"/>
      <circle cx="1650" cy="315" r="9"/><circle cx="1650" cy="668" r="8"/>
    </g>
  </g>
  <g fill="none" stroke="#6EE7FF" stroke-width="1.2" opacity="0.6">
    <circle cx="698" cy="450" r="20"/><circle cx="1650" cy="315" r="20"/>
    <circle cx="979" cy="765" r="18"/>
  </g>

  <!-- the nexus -->
  <circle cx="1380" cy="480" r="300" fill="url(#core)" filter="url(#soft)"/>
  <circle cx="1380" cy="480" r="170" fill="url(#core)"/>
  <circle cx="1380" cy="480" r="16" fill="#FFFFFF" filter="url(#glow)"/>
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.7" filter="url(#glow)">
    <path d="M1380 200V760M1100 480H1660" opacity="0.5"/>
  </g>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="90" r="1.5" opacity=".7"/><circle cx="420" cy="620" r="1.5" opacity=".5"/>
    <circle cx="560" cy="80" r="1.2" opacity=".6"/><circle cx="1010" cy="120" r="1.6" opacity=".8"/>
    <circle cx="1240" cy="60" r="1.2" opacity=".6"/><circle cx="1780" cy="90" r="1.8" opacity=".8"/>
    <circle cx="1860" cy="500" r="1.3" opacity=".6"/><circle cx="1560" cy="960" r="1.5" opacity=".6"/>
    <circle cx="260" cy="810" r="1.4" opacity=".5"/><circle cx="1000" cy="960" r="1.3" opacity=".6"/>
    <circle cx="1490" cy="130" r="1.5" opacity=".7"/><circle cx="90" cy="520" r="1.2" opacity=".5"/>
  </g>

  <!-- keep the left side calm for the headline -->
  <rect width="1920" height="1080" fill="url(#textShade)"/>
</svg>
