<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!--
    Static build of nexus-jarvis-background.svg, identical artwork with every
    animate and animateTransform element removed. CSS cannot pause SMIL on its
    own, so prefers-reduced-motion swaps this file in instead.

    Rotation phases are baked in as transform="rotate(...)" so the static frame
    still looks composed rather than like everything is at zero degrees.
  -->
  <defs>
    <radialGradient id="base" cx="72%" cy="48%" r="85%">
      <stop offset="0" stop-color="#0A1A24"/>
      <stop offset="0.4" stop-color="#061019"/>
      <stop offset="1" stop-color="#04080F"/>
    </radialGradient>

    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#00D4E8" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#00D4E8" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#0092B8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00D4E8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweepFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4E8" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#00D4E8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00D4E8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D4E8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D4E8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00D4E8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D4E8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#00D4E8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00D4E8" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#04080F" stop-opacity="0"/>
      <stop offset="1" stop-color="#04080F" stop-opacity="0.85"/>
    </radialGradient>

    <path id="hex" d="M0 -14 L12.12 -7 L12.12 7 L0 14 L-12.12 7 L-12.12 -7 Z"/>

    <pattern id="hexGrid" width="48.5" height="42" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#00D4E8" stroke-width="1">
        <use href="#hex" x="12.12" y="10.5"/>
        <use href="#hex" x="36.37" y="31.5"/>
        <use href="#hex" x="12.12" y="-31.5"/>
        <use href="#hex" x="36.37" y="-10.5"/>
        <use href="#hex" x="-12.12" y="10.5"/>
        <use href="#hex" x="12.12" y="52.5"/>
        <use href="#hex" x="-36.37" y="31.5"/>
        <use href="#hex" x="12.12" y="73.5"/>
      </g>
    </pattern>

    <mask id="gridMask">
      <rect width="1920" height="1080" fill="url(#gridMaskGrad)"/>
    </mask>
    <radialGradient id="gridMaskGrad" cx="72%" cy="48%" r="52%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <g mask="url(#gridMask)" opacity="0.5">
    <rect width="1920" height="1080" fill="url(#hexGrid)"/>
  </g>

  <circle cx="1380" cy="520" r="520" fill="url(#coreGlow)" opacity="0.35"/>

  <g fill="none">
    <circle cx="1380" cy="520" r="150" stroke="url(#ringFade)" stroke-width="1.6"
            stroke-dasharray="34 18 6 18" transform="rotate(38 1380 520)"/>
    <circle cx="1380" cy="520" r="235" stroke="#00D4E8" stroke-width="1.2" opacity="0.6"
            stroke-dasharray="10 14 60 14" transform="rotate(-64 1380 520)"/>
    <circle cx="1380" cy="520" r="330" stroke="#00D4E8" stroke-width="1" opacity="0.42"
            stroke-dasharray="120 30 8 30" transform="rotate(148 1380 520)"/>
    <circle cx="1380" cy="520" r="425" stroke="#00D4E8" stroke-width="0.9" opacity="0.26"
            stroke-dasharray="4 22" transform="rotate(-212 1380 520)"/>
  </g>

  <g fill="none" stroke="#00D4E8" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M1380 268 A252 252 0 0 1 1632 394" transform="rotate(52 1380 520)"/>
    <path d="M1128 646 A252 252 0 0 1 1380 772" transform="rotate(-133 1380 520)"/>
  </g>

  <path d="M1380 520 L1380 95 A425 425 0 0 1 1665 195 Z" fill="url(#sweepFade)"
        opacity="0.5" transform="rotate(41 1380 520)"/>

  <circle cx="1380" cy="520" r="70" fill="url(#coreGlow)"/>
  <circle cx="1380" cy="520" r="26" fill="#00D4E8" opacity="0.9"/>
  <circle cx="1380" cy="520" r="9" fill="#CFFBFF" opacity="0.95"/>

  <g transform="translate(742 0)">
    <rect x="-60" y="0" width="120" height="1080" fill="url(#scanFade)"/>
    <line x1="0" y1="0" x2="0" y2="1080" stroke="#00D4E8" stroke-width="1" opacity="0.35"/>
  </g>

  <g stroke="#00D4E8" stroke-width="1" opacity="0.22">
    <path d="M0 1040H1920"/>
    <path d="M160 1020v40M480 1020v40M800 1020v40M1120 1020v40M1440 1020v40M1760 1020v40"
          stroke-dasharray="2 6"/>
  </g>

  <g fill="none" stroke="#00D4E8" stroke-width="2" stroke-linecap="square" opacity="0.4">
    <path d="M56 116V56h60"/>
    <path d="M1864 56h-60v60"/>
    <path d="M56 964v60h60"/>
    <path d="M1804 1024h60v-60"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
